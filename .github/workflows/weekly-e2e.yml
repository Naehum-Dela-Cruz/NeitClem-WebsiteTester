name: Weekly End-to-End Tests
on:
  schedule:
    - cron: '0 8 * * 2'  # Every Tuesday at 08:00 UTC (Midnight PST)
  workflow_dispatch:

jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run E2E Submission Tests
      run: npx playwright test --grep-invert "Applications Library Tests"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: e2e-playwright-report
        path: playwright-report/
        retention-days: 30
