name: Playwright Tests
on:
  schedule:
    - cron: '0 8 * * *'  # midnight PST (UTC-8)
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Commit test results
      if: ${{ !cancelled() && github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/data/applications-ok-results.json
        git diff --cached --quiet || git commit -m "chore: update test results [skip ci]"
        git push
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: applications-ok-results
        path: docs/data/applications-ok-results.json
        retention-days: 30
